<!doctype html><meta charset="utf-8">
<style>
    * {
        box-sizing: border-box;
        /* monokai terminal theme */
        /* <https://gist.github.com/brayevalerien/cb94ac685ebc186f359deae113b6710c> */
        --monokai-fg: /* Editor Foreground */ #f8f8f2;
        --monokai-bg: /* Editor Background */ #272822;
        --sgr-30: /* Terminal ANSI Black */ #333333;
        --sgr-31: /* Terminal ANSI Red */ #c4265e;
        --sgr-32: /* Terminal ANSI Green */ #86b42b;
        --sgr-33: /* Terminal ANSI Yellow */ #b3b42b;
        --sgr-34: /* Terminal ANSI Blue */ #6a7ec8;
        --sgr-35: /* Terminal ANSI Magenta */ #8c6bc8;
        --sgr-36: /* Terminal ANSI Cyan */ #56adbc;
        --sgr-37: /* Terminal ANSI White */ #e3e3dd;
        --sgr-90: /* Terminal ANSI Bright Black */ #666666;
        --sgr-91: /* Terminal ANSI Bright Red */ #f92672;
        --sgr-92: /* Terminal ANSI Bright Green */ #a6e22e;
        --sgr-93: /* Terminal ANSI Bright Yellow */ #e2e22e;
        --sgr-94: /* Terminal ANSI Bright Blue */ #819aff;
        --sgr-95: /* Terminal ANSI Bright Magenta */ #ae81ff;
        --sgr-96: /* Terminal ANSI Bright Cyan */ #66d9ef;
        --sgr-97: /* Terminal ANSI Bright White */ #f8f8f2;
    }
    body {
        display: flex;
        flex-flow: row wrap;
        gap: 1em;
        margin: 0 1em;
    }
    main {
        flex: 1 0 40rem;
        /* avoid wide <img width> causing flex wrap */
        width: 40rem;
    }
    kbd {
        background: #00000040;
        margin: 0 0.125rem;
        padding: 0.125rem;
        border-radius: 0.25rem;
    }
    #toolbar, #ifAnySelectedCommits {
        font-size: 1rem;
        margin: 0.5em 0;
    }
    #toolbar button,
    #ifAnySelectedCommits button {
        margin: 0.125rem 0;
    }
    #searchApiDocs {
        position: fixed;
        width: 0;
    }
    #searchApiDocsButton {
        width: max-content;
        position: absolute;
        right: 0;
    }
    #titleArea {
        font-size: 2rem;
        margin: 0.5em 0;
    }
    #selectCommit {
        width: 1.5rem;
        height: 1.5rem;
    }
    #selectedCommitCount {
        font-size: 0.75rem;
    }
    #title {
        display: inline;
        font-size: 2rem;
        font-weight: normal;
    }
    #title.Untriaged {
        color: darkorange;
    }
    #title.Ignored {
        color: grey;
    }
    #title.Accepted {
        color: green;
    }
    #gitShow {
        flex: 1 0 40rem;
        max-height: 100vh;
        margin: 0;
        padding: 0.5em;
        overflow: scroll;
        color: var(--monokai-fg);
        background: var(--monokai-bg);
    }
    #editorDialog {
        width: 100%;
    }
    #gotoDialog {
        width: max-content;
    }
    #wordCloudDialog[open] {
        display: flex;
        flex-flow: column nowrap;
        overflow: hidden;
    }
    #wordCloudDialog pre {
        flex: 1 1 auto;
        overflow: scroll;
    }
    #searchDialog[open] {
        min-width: 60%;
        display: flex;
        flex-flow: column nowrap;
        overflow: hidden;
    }
    #searchDialog div {
        display: flex;
        flex-flow: row nowrap;
        gap: 1em;
    }
    #searchDialog pre {
        flex: 1 1 auto;
        overflow: scroll;
    }
    #input {
        width: 100%;
    }
</style>
<main>
    <div id="toolbar">
        <button onclick="doAccept()"><kbd>+</kbd> accept</button>
        <button onclick="doIgnore()"><kbd>−</kbd> ignore</button>
        <button onclick="doDone()"><kbd><b>.</b></kbd> done</button>
        <button onclick="doLabel()"><kbd>T</kbd> label</button>
        <br>
        <button onclick="doWordCloud()"><kbd>W</kbd> word cloud</button>
        <button onclick="doGoToCommit()"><kbd>G</kbd> go to commit</button>
        <button onclick="doNext()"><kbd>J</kbd> next</button>
        <button onclick="doPrevious()"><kbd>K</kbd> previous</button>
        <br>
        <button onclick="doSearch()"><kbd>/</kbd> search</button>
        <button onclick="doNextInSearch()"><kbd>Shift</kbd>+<kbd>J</kbd> next in search</button>
        <button onclick="doPreviousInSearch()"><kbd>Shift</kbd>+<kbd>K</kbd> previous in search</button>
        <br>
        <a href="#" onclick="return false"></a>
        <button onclick="doSelect()" id="selectButton"><kbd>Space</kbd> select</button>
        <a href="#" onclick="return false"></a>
        <button onclick="copyCommitReferencesToClipboard()" id="copyReferenceButton"><kbd>Ctrl</kbd>+<kbd>C</kbd> copy reference</button>
        <br>
        <form id="softHyphens">
            soft hyphens:
            <label><input type="radio" name="value" value="off" checked> off</label>
            <label><input type="radio" name="value" value="on"> on</label>
            <label><input type="radio" name="value" value="debug"> debug</label>
        </form>
        <form id="linkifyCopies">
            linkify copies:
            <label><input type="radio" name="value" value="off" checked> off</label>
            <label><input type="radio" name="value" value="on"> on</label>
        </form>
        <div id="searchApiDocs" hidden>
            <button id="searchApiDocsButton" onclick="doSearchApiDocs()">search API docs</button>
        </div>
    </div>
    <div id="titleArea">
        <div id="ifAnySelectedCommits">
            <button onclick="clearSelection()">clear selection</button>
            <button onclick="copyCommitReferencesToClipboard()"><kbd>Ctrl</kbd>+<kbd>C</kbd> copy references</button>
            <button onclick="copyCommitSummaryToClipboard()">copy summary</button>
            <!-- not currently keyboard bound to `.`, because i worry about accidents -->
            <button onclick="markCommitsDone()">mark commits done</button>
        </div>
        <label for="selectCommit">
            <input type="checkbox" id="selectCommit"
            ><span id="selectedCommitCount">(0)</span>
            <h1 id="title"></h1>
        </label>
    </div>
    <div id="meta"></div>
    <div id="label"></div>
    <ul id="hints"></ul>
    <hr>
    <div id="content"></div>
</main>
<pre id="gitShow"></pre>
<dialog id="editorDialog"><form id="editorForm" method="dialog">
    <input id="input" autofocus size="100">
</form></dialog>
<dialog id="gotoDialog"><form id="gotoForm" method="dialog">
    #<input id="gotoInput" autofocus>
</form></dialog>
<dialog id="searchDialog">
    <div>
        <button onclick="updateSearch()">update</button>
        <div style="flex-flow: column nowrap; flex: 1 1 auto;">
            <input id="searchFilter" placeholder="JS filter ((commit, text) => ...)"
                value='commit.state == "Untriaged" && !commit.authors.includes("@servo-wpt-sync") && !commit.authors.includes("@dependabot[bot]")'
                onchange="renderSearchDialog()" oninput="renderSearchDialog()">
            <div>
                <button onclick='
                    searchFilter.value = searchFilter.getAttribute("value");
                    renderSearchDialog();
                '>i’m triaging</button>
                <button onclick='
                    searchFilter.value = `["Accepted", "Done"].includes(commit.state)`;
                    renderSearchDialog();
                '>i’m writing</button>
                or add search criteria:
                <button onclick='
                    searchFilter.value = `text.includes("") && ` + searchFilter.value;
                    searchFilter.selectionStart = searchFilter.selectionEnd = 15;
                    searchFilter.focus();
                    renderSearchDialog();
                '>free text</button>
                <button onclick='
                    searchFilter.value = `commit.label.length == 0 && ` + searchFilter.value;
                    searchFilter.selectionStart = 0;
                    searchFilter.selectionEnd = 24;
                    searchFilter.focus();
                    renderSearchDialog();
                '>unlabelled</button>
            </div>
        </div>
    </div>
    <!-- tabindex + autofocus to avoid scrolling to top on every showModal() -->
    <pre tabindex="-1" autofocus></pre>
</dialog>
<dialog id="wordCloudDialog">
    <button onclick="updateWordCloud()">update</button>
    <!-- tabindex + autofocus to avoid scrolling to top on every showModal() -->
    <pre tabindex="-1" autofocus></pre>
</dialog>
<script type="module" src="main.js"></script>
